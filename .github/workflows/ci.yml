name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test release tooling
        run: node --test scripts/ci/*.test.mjs
      - name: Resolve version
        run: echo "PLUGIN_VERSION=$(node scripts/ci/version.mjs)" >> "$GITHUB_ENV"
      - name: Test and build plugin
        run: ./gradlew --no-daemon --console=plain test buildPlugin -PpluginVersion="$PLUGIN_VERSION"
      - name: Verify release compatibility
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew --no-daemon --console=plain verifyPlugin -PpluginVersion="$PLUGIN_VERSION"
      - name: Prepare ZIP, checksums and release notes
        run: node scripts/ci/prepare-release.mjs "$PLUGIN_VERSION"
      - name: Upload plugin bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-bundle
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-bundle
          path: build/release/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" build/release/* \
            --repo "$GH_REPO" --verify-tag --title "GitLab CI Graph $RELEASE_TAG" \
            --notes-file build/release/RELEASE_NOTES.md "${flags[@]}"
